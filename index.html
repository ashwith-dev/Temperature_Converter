<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm space-y-4">
    <h2 class="text-xl font-bold text-center text-gray-800">Temperature Converter</h2>

    <!-- Temperature Input -->
    <div>
      <label class="block text-sm text-gray-600 mb-1">Temperature</label>
      <input 
        type="number" 
        id="tempInput" 
        placeholder="Enter temperature" 
        class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- From Unit -->
    <div>
      <label class="block text-sm text-gray-600 mb-1">From</label>
      <select id="fromUnit" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="" disabled selected>Select Unit</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
      </select>
    </div>

    <!-- To Unit -->
    <div>
      <label class="block text-sm text-gray-600 mb-1">To</label>
      <select id="toUnit" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="" disabled selected>Select Unit</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
      </select>
    </div>

    <!-- Convert Button -->
    <button 
      id="convertBtn" 
      disabled 
      class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-2 rounded-lg transition"
    >
      Convert
    </button>

    <!-- Converted Temperature Display -->
    <div id="result" class="text-center text-lg font-bold text-gray-800 mt-4"></div>
  </div>

  <script>
    // 1. Your JS functions
    function celsiusToFahrenheit(celsius) {
      return (celsius * 9) / 5 + 32;
    }

    function fahrenheitToCelsius(fahrenheit) {
      return ((fahrenheit - 32) * 5) / 9;
    }

    function formatTemperature(value, unit) {
      return `${value} ${unit}`;
    }

    // 2. DOM elements
    const tempInput = document.getElementById("tempInput");
    const fromUnit = document.getElementById("fromUnit");
    const toUnit = document.getElementById("toUnit");
    const convertBtn = document.getElementById("convertBtn");
    const result = document.getElementById("result");

    // 3. Enable button only when all three fields are filled in
    function checkInputs() {
      const isFilled = tempInput.value !== "" && fromUnit.value !== "" && toUnit.value !== "";
      convertBtn.disabled = !isFilled;
    }

    tempInput.addEventListener("input", checkInputs);
    fromUnit.addEventListener("change", checkInputs);
    toUnit.addEventListener("change", checkInputs);

    // 4. Click event to convert and display result
    convertBtn.addEventListener("click", () => {
      const value = parseFloat(tempInput.value);
      const from = fromUnit.value;
      const to = toUnit.value;
      let convertedValue = value;

      if (from === "C" && to === "F") {
        convertedValue = celsiusToFahrenheit(value);
      } else if (from === "F" && to === "C") {
        convertedValue = fahrenheitToCelsius(value);
      }

      result.textContent = formatTemperature(convertedValue, to);
    });
  </script>
</body>
</html>
